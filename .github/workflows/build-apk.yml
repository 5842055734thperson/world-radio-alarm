name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Release signing key: created on the first run, then reused from the Actions
      # cache so new APKs update the installed app. It is never committed to git.
      - name: Restore signing key
        id: signing
        uses: actions/cache@v4
        with:
          path: |
            android/app/signing
            android/key.properties
          key: world-radio-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.signing.outputs.cache-hit != 'true'
        run: |
          mkdir -p android/app/signing
          PASS=$(openssl rand -hex 24)
          keytool -genkeypair -keystore android/app/signing/release.jks \
            -storepass "$PASS" -keypass "$PASS" -alias radio \
            -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=World Radio Alarm"
          printf 'storeFile=signing/release.jks\nstorePassword=%s\nkeyAlias=radio\nkeyPassword=%s\n' "$PASS" "$PASS" > android/key.properties

      # Offline station catalog: refreshed when Radio Browser is up, otherwise the
      # last good snapshot comes back from the cache.
      - name: Restore station snapshot
        uses: actions/cache@v4
        with:
          path: assets/stations.json
          key: station-snapshot-${{ github.run_id }}
          restore-keys: station-snapshot-

      - name: Update station snapshot
        run: python3 tool/snapshot_stations.py

      - name: Download Chillax font (Fontshare)
        run: tool/get_fonts.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - run: cp build/app/outputs/flutter-apk/app-release.apk WorldRadio.apk

      # Smaller APK for 64-bit ARM phones (nearly all current phones). Same version
      # code and key as the universal APK, so either one updates the other.
      - name: Build arm64 APK
        run: |
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk WorldRadio-arm64.apk

      # Kept even if publishing the release fails.
      - name: Upload APKs as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldRadio-1.0.${{ github.run_number }}
          path: |
            WorldRadio.apk
            WorldRadio-arm64.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: radio-v1.0.${{ github.run_number }}
          name: World Radio 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            WorldRadio.apk
            WorldRadio-arm64.apk
          body: |
            Android radio app with world stations and a radio alarm clock.
            Download **WorldRadio-arm64.apk** (smaller, for most phones) or the universal
            **WorldRadio.apk** on your phone and open it to install.
